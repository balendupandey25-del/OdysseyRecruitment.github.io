<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odyssey | Design Team Call</title>
<style>
  :root {
    color-scheme: dark;
    --navy: #0d2534;
    --navy-deep: #030a0f;
    --ivory: #f4e4c4;
    --gold: #b9954e;
    --gold-light: #e7cf9c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #e8e8e8;
    font-family: Georgia, "Times New Roman", serif;
  }
  .odyssey-wrap { width: 100%; max-width: 768px; margin: 0 auto; }
  .odyssey-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 768 / 492;
    overflow: hidden;
    isolation: isolate;
    container-type: inline-size;
    background-color: var(--navy);
    background-image:
      radial-gradient(circle at 8% 14%, rgba(246,226,187,.90) 0 1px, transparent 1.7px),
      radial-gradient(circle at 21% 34%, rgba(246,226,187,.65) 0 1px, transparent 1.8px),
      radial-gradient(circle at 31% 9%, rgba(246,226,187,.80) 0 1px, transparent 1.7px),
      radial-gradient(circle at 43% 22%, rgba(246,226,187,.65) 0 1px, transparent 1.8px),
      radial-gradient(circle at 58% 8%, rgba(246,226,187,.85) 0 1px, transparent 1.8px),
      radial-gradient(circle at 72% 19%, rgba(246,226,187,.65) 0 1px, transparent 1.8px),
      radial-gradient(circle at 89% 13%, rgba(246,226,187,.80) 0 1px, transparent 1.8px),
      radial-gradient(circle at 96% 40%, rgba(246,226,187,.80) 0 1px, transparent 1.8px),
      radial-gradient(circle at 14% 73%, rgba(246,226,187,.70) 0 1px, transparent 1.8px),
      radial-gradient(circle at 29% 86%, rgba(246,226,187,.80) 0 1px, transparent 1.8px),
      radial-gradient(circle at 48% 93%, rgba(246,226,187,.65) 0 1px, transparent 1.8px),
      radial-gradient(circle at 65% 82%, rgba(246,226,187,.80) 0 1px, transparent 1.8px),
      radial-gradient(circle at 83% 90%, rgba(246,226,187,.65) 0 1px, transparent 1.8px),
      radial-gradient(circle at 94% 69%, rgba(246,226,187,.85) 0 1px, transparent 1.8px),
      radial-gradient(ellipse at 50% 50%, rgba(27,62,78,.25), transparent 65%);
  }

  /* Static stars plus two independently twinkling star fields. */
  .stars, .stars::before, .stars::after {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .stars {
    z-index: 1;
    opacity: .62;
    background-image:
      radial-gradient(circle, #f1ddb0 0 1px, transparent 1.5px),
      radial-gradient(circle, #f1ddb0 0 1px, transparent 1.5px),
      radial-gradient(circle, #d9b977 0 .8px, transparent 1.5px);
    background-size: 173px 139px, 229px 181px, 311px 223px;
    background-position: 12px 20px, 73px 61px, 141px 99px;
  }
  .stars::before {
    content: "";
    opacity: .25;
    background-image:
      radial-gradient(circle, #fff0cc 0 1.2px, transparent 1.8px),
      radial-gradient(circle, #d9b977 0 1px, transparent 1.7px);
    background-size: 191px 157px, 263px 197px;
    background-position: 38px 17px, 119px 83px;
    animation: twinkle-a 3.7s ease-in-out infinite alternate;
  }
  .stars::after {
    content: "";
    opacity: .18;
    background-image:
      radial-gradient(circle, #f7e5bc 0 1.1px, transparent 1.8px),
      radial-gradient(circle, #f7e5bc 0 .8px, transparent 1.6px);
    background-size: 307px 211px, 137px 173px;
    background-position: 83px 49px, 21px 117px;
    animation: twinkle-b 5.1s ease-in-out -2s infinite alternate;
  }

  /* The SVG ellipse and JavaScript marker positions share one geometry config. */
  .orbit-art {
    position: absolute;
    z-index: 2;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  .orbit-path {
    fill: none;
    stroke: var(--orbit-stroke);
    stroke-width: 1.15;
    vector-effect: non-scaling-stroke;
  }

  /* Each icon's centre is placed directly on its ellipse. */
  .planet-anchor {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .planet-icon {
    position: absolute;
    left: 0;
    top: 0;
    width: clamp(34px, 7.05cqw, 54px);
    height: clamp(34px, 7.05cqw, 54px);
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--gold);
    border-radius: 50%;
    background: #163b50;
    color: #f5e3bf;
    box-shadow: 0 0 0 6px rgba(185,146,77,.08), 0 0 22px rgba(213,174,100,.16);
    font-family: Arial, sans-serif;
    font-size: clamp(19px, 3.5cqw, 27px);
    line-height: 1;
    overflow: hidden;
  }
  /* Uploaded PNG/JPEG fills the circle; transparent PNGs show the navy disc behind them. */
  .planet-icon img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    pointer-events: none;
    user-select: none;
  }
  .planet-icon.has-img { background: #163b50; }

  /* Preview-only upload panel: appears when the URL ends in ?edit */
  .icon-editor {
    position: fixed; right: 12px; bottom: 12px; z-index: 99;
    display: grid; gap: 8px; padding: 12px 14px;
    background: rgba(7,27,40,.95); color: #f4e4c4;
    border: 1px solid #b9954e; border-radius: 10px;
    font: 12px/1.3 Arial, sans-serif;
  }
  .icon-editor label { display: grid; gap: 3px; }
  .icon-editor input { font-size: 11px; color: #f4e4c4; }
  .planet-label {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 50%;
    width: clamp(84px, 13.55cqw, 104px);
    min-height: 31px;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5px 5px 6px;
    border-top: 1px solid rgba(185,146,77,.82);
    border-bottom: 1px solid rgba(185,146,77,.82);
    background: rgba(7,27,40,.91);
    color: #fff1d4;
    text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.32);
    font-size: clamp(9px, 1.6cqw, 12.3px);
    line-height: 1.12;
    font-weight: bold;
    letter-spacing: .25px;
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
  }

  /* The centre is a single clickable planet with a transparent PNG background. */
  .center-link {

    z-index: 8;
    left: 50%;
    top: 50%;

<body>
<div class="odyssey-wrap">
  <section class="odyssey-stage" id="odysseyStage" role="group" aria-label="Odyssey Design Team openings">
    <div class="stars" aria-hidden="true"></div>
    <svg class="orbit-art" id="orbitArt" viewBox="0 0 768 492" preserveAspectRatio="none" aria-hidden="true"></svg>

    <div class="planet-anchor" id="planet-graphic" aria-hidden="true">
      <div class="planet-icon">✎</div>
    </div>
    <div class="planet-label" id="label-graphic">Graphic<br>Designer</div>

    <div class="planet-anchor" id="planet-social" aria-hidden="true">
      <div class="planet-icon">✧</div>
    </div>
    <div class="planet-label" id="label-social">Social Media<br>Manager</div>

    <div class="planet-anchor" id="planet-video" aria-hidden="true">
      <div class="planet-icon">▶</div>
    </div>
    <div class="planet-label" id="label-video">Video<br>Editor</div>

    <a class="center-link" href="https://forms.gle/aHW14BVxvhSRzXNcA" target="_blank" rel="noopener noreferrer" aria-label="Register now for the Odyssey Design Team">
      <span class="register-now">REGISTER NOW</span>
    </a>
  </section>
</div>
<script>
(() => {
  'use strict';

  /*
    One source of truth for BOTH the visible gold ellipses and moving planets.
    The ellipse formula below is also the SVG ellipse parameterisation:
      localX = rx * cos(t), localY = ry * sin(t)
      world = centre + rotate(localX, localY, tilt)
  */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const VIEW = { width: 768, height: 492, cx: 384, cy: 246 };
  const LABEL_OFFSET = 51; // distance from the ellipse to the label centre, SVG units
  const ORBITS = [
    { id: 'graphic', rx: 260, ry: 150, tilt: -8, duration: 33, phase: Math.PI, stroke: 'rgba(190,157,86,.96)' },
    { id: 'social',  rx: 285, ry: 155, tilt:  12, duration: 38, phase: -0.95, stroke: 'rgba(213,194,151,.78)' },
    { id: 'video',   rx: 235, ry: 150, tilt: -15, duration: 29, phase:  0.95, stroke: 'rgba(190,157,86,.70)' }
  ];

  /*
    PLANET ICON IMAGES (PNG or JPEG)
    Put your image files next to this HTML file (e.g. in an "icons" folder) and point
    each path below at them. If a file is missing or fails to load, the original
    glyph (✎ ✧ ▶) is shown instead. A full URL or a data: URI also works.
    Square images look best; they are cropped to a circle.
  */
  const PLANET_ICONS = {
    graphic: 'icons/graphic.png',
    social:  'icons/social.png',
    video:   'icons/video.png'
  };

  function setPlanetIcon(id, src) {
    const box = document.querySelector(`#planet-${id} .planet-icon`);
    if (!box) return;
    if (box.dataset.glyph === undefined) box.dataset.glyph = box.textContent.trim();
    if (!src) {                       // no image: restore glyph
      box.classList.remove('has-img');
      box.textContent = box.dataset.glyph;
      return;
    }
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.onload = () => {
      box.classList.add('has-img');
      box.textContent = '';
      box.appendChild(img);
    };
    img.onerror = () => setPlanetIcon(id, '');   // fall back to the glyph
    img.src = src;
  }

  for (const id of Object.keys(PLANET_ICONS)) setPlanetIcon(id, PLANET_ICONS[id]);

  /* Preview helper: open this page with ?edit on the end to try images from your computer. */
  if (/[?&]edit\b/.test(location.search)) {
    const panel = document.createElement('div');
    panel.className = 'icon-editor';
    panel.innerHTML = '<strong>Preview planet icons</strong>';
    for (const [id, label] of [['graphic','Graphic Designer'],['social','Social Media Manager'],['video','Video Editor']]) {
      const row = document.createElement('label');
      row.textContent = label;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/png,image/jpeg';
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => setPlanetIcon(id, reader.result);
        reader.readAsDataURL(file);
      });
      row.appendChild(input);
      panel.appendChild(row);
    }
    document.body.appendChild(panel);
  }

  const stage = document.getElementById('odysseyStage');
  const svg = document.getElementById('orbitArt');
  const elements = new Map();
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* Draw each gold path from the same rx/ry/tilt used for its planet. */
  for (const orbit of ORBITS) {
    const ellipse = document.createElementNS(SVG_NS, 'ellipse');
    ellipse.setAttribute('cx', VIEW.cx);
    ellipse.setAttribute('cy', VIEW.cy);
    ellipse.setAttribute('rx', orbit.rx);
    ellipse.setAttribute('ry', orbit.ry);
    ellipse.setAttribute('transform', `rotate(${orbit.tilt} ${VIEW.cx} ${VIEW.cy})`);
    ellipse.setAttribute('class', 'orbit-path');
    ellipse.style.setProperty('--orbit-stroke', orbit.stroke);
    svg.appendChild(ellipse);

    elements.set(orbit.id, {
      planet: document.getElementById(`planet-${orbit.id}`),
      label: document.getElementById(`label-${orbit.id}`)
    });
  }

  function placeOrbit(orbit, angle) {
    const cosT = Math.cos(angle);
    const sinT = Math.sin(angle);
    const tilt = orbit.tilt * Math.PI / 180;
    const cosR = Math.cos(tilt);
    const sinR = Math.sin(tilt);

    // Planet centre: exact parametric point on the SVG ellipse centreline.
    const localX = orbit.rx * cosT;
    const localY = orbit.ry * sinT;
    const x = VIEW.cx + localX * cosR - localY * sinR;
    const y = VIEW.cy + localX * sinR + localY * cosR;

    // Outward ellipse normal: keeps each label outside the orbit and away from the logo.
    let normalX = (cosT / orbit.rx) * cosR - (sinT / orbit.ry) * sinR;
    let normalY = (cosT / orbit.rx) * sinR + (sinT / orbit.ry) * cosR;
    const normalLength = Math.hypot(normalX, normalY) || 1;
    normalX /= normalLength;
    normalY /= normalLength;

    let labelX = x + normalX * LABEL_OFFSET;
    let labelY = y + normalY * LABEL_OFFSET;
    const nodes = elements.get(orbit.id);

    // Keep labels inside the visible stage at narrow widths. The planet itself
    // is never clamped: its centre remains on the exact ellipse centreline.
    const scaleX = stage.clientWidth / VIEW.width;
    const scaleY = stage.clientHeight / VIEW.height;
    const labelHalfWidth = (nodes.label.offsetWidth / scaleX) / 2;
    const labelHalfHeight = (nodes.label.offsetHeight / scaleY) / 2;
    const safeMarginX = 5 / scaleX;
    const safeMarginY = 5 / scaleY;
    labelX = Math.min(VIEW.width - labelHalfWidth - safeMarginX,
      Math.max(labelHalfWidth + safeMarginX, labelX));
    labelY = Math.min(VIEW.height - labelHalfHeight - safeMarginY,
      Math.max(labelHalfHeight + safeMarginY, labelY));

    // Percentage coordinates make the HTML markers scale with the responsive SVG.
    // This same x/y pair comes from the exact rx/ry/tilt used to draw the SVG ellipse.
    nodes.planet.style.left = `${(x / VIEW.width) * 100}%`;
    nodes.planet.style.top = `${(y / VIEW.height) * 100}%`;
    nodes.label.style.left = `${(labelX / VIEW.width) * 100}%`;
    nodes.label.style.top = `${(labelY / VIEW.height) * 100}%`;
  }

  const startTime = performance.now();
  let animationFrame = 0;

  function render(now) {
    const elapsed = (now - startTime) / 1000;
    for (const orbit of ORBITS) {
      const angle = orbit.phase + (elapsed / orbit.duration) * Math.PI * 2;
      placeOrbit(orbit, angle);
    }
    if (!reducedMotion.matches) animationFrame = requestAnimationFrame(render);
  }

  function applyMotionPreference() {
    if (animationFrame) cancelAnimationFrame(animationFrame);
    animationFrame = 0;
    if (reducedMotion.matches) {
      for (const orbit of ORBITS) placeOrbit(orbit, orbit.phase);
    } else {
      animationFrame = requestAnimationFrame(render);
    }
  }

  applyMotionPreference();
  if (typeof reducedMotion.addEventListener === 'function') {
    reducedMotion.addEventListener('change', applyMotionPreference);
  } else if (typeof reducedMotion.addListener === 'function') {
    reducedMotion.addListener(applyMotionPreference);
  }
})();
</script>
</body>
</html>
